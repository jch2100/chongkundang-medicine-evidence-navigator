name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 검증을 통과하지 못한 데이터는 배포하지 않는다.
      - name: Validate dataset
        run: node scripts/validate-data.mjs

      # 공개 대상만 골라 담는다. 원본 CSV·문서·스크립트는 배포하지 않는다.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css favicon.svg _site/
          mkdir -p _site/data/public
          cp data/public/*.json _site/data/public/
          mkdir -p _site/qa/runs
          cp qa/runs/latest.json _site/qa/runs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
