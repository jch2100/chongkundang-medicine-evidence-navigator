name: Validate evidence dataset

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON and scope rules
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-data.mjs
      - name: Check public links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './index.html' './data/public/*.json' './README.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
